name: Release

on:
  push:
    branches: ['main']
    tags: ['*']
  pull_request:
    branches: ['main']

# Serialize runs of the same ref: a queued run starts only once the one ahead
# of it has finished, so two of them cannot compute the same next version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 'fankhauserli/voabkr-frontend/voabkr-frontend'

jobs:
  # The gates run here once, and the version is computed here once; the jobs
  # below consume both through this job's outputs instead of redoing either.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    outputs:
      version: ${{ steps.versioning.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Code formatting check & lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Run unit tests
        run: bun run test:unit --project server --run

      - name: Determine and bump version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          package="${GITHUB_REPOSITORY##*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"

          # Aggregate tags from git refs and GitHub container package registry
          versions=$(
            {
              git ls-remote --tags --refs origin 2>/dev/null \
                | awk -F/ '{print $3}'
              git tag -l 2>/dev/null || true
              gh api --paginate "/users/${owner}/packages/container/${package}/versions" 2>/dev/null \
                | jq -r '.[].metadata.container.tags[]?' 2>/dev/null || true
            } \
              | sed -E 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$' \
              | sort -V -u || true
          )

          latest=$(printf '%s\n' "${versions}" | tail -n 1)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            next="${GITHUB_REF_NAME#v}"
            next="${next%%-pre.*}"
          elif [[ -z "${latest}" ]]; then
            next="0.1.0-pre.1"
          elif [[ "${latest}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-pre\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-pre.$((BASH_REMATCH[4] + 1))"
          elif [[ "${latest}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-pre.1"
          else
            next="${latest}-pre.1"
          fi

          echo "tag=${next}" >> "${GITHUB_OUTPUT}"
          echo "version=${next}" >> "${GITHUB_OUTPUT}"
          echo "Using version ${next}"

  # Builds and pushes the container image, and creates the version git tag on
  # main pushes — unchanged from when both shared a job with the gates.
  docker:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push Git tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          next="${{ needs.prepare.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "v${next}" >/dev/null 2>&1; then
            git tag "v${next}"
            git push origin "v${next}" || true
            echo "✅ Created and pushed git tag v${next}"
          fi

  # The APK the release publishes: the static web build — never the Node SSR
  # build — synced into the checked-in Android platform project, assembled with
  # the version the prepare job computed, then verified and uploaded as a
  # workflow artifact. It needs no secrets: without the release keystore the
  # app module falls back to debug signing, so fork pull requests get an
  # installable APK too.
  android:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the static web bundle
        env:
          # Setting the VITE_API_URL repository variable points the APK at that
          # backend; unset, the client keeps its built-in production default.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: bun run build:static

      - name: Sync the web bundle into the Android project
        run: bunx cap sync android

      - name: Encode the version fields
        id: versioning
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          bun src/lib/release/version-cli.ts "${VERSION}" | tee -a "${GITHUB_OUTPUT}"

      - name: Assemble the release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.versioning.outputs.versionCode }}
          VERSION_NAME: ${{ steps.versioning.outputs.versionName }}
        run: ./gradlew assembleRelease -PversionCode="${VERSION_CODE}" -PversionName="${VERSION_NAME}"

      - name: Verify the APK
        env:
          VERSION_CODE: ${{ steps.versioning.outputs.versionCode }}
          VERSION_NAME: ${{ steps.versioning.outputs.versionName }}
        run: |
          set -euo pipefail

          apk='android/app/build/outputs/apk/release/app-release.apk'
          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -n 1)"

          # A signature that does not verify, or a version that is not the
          # run's, fails the job here — before anything is uploaded. The package
          # line of the badging carries the manifest's own versionCode and
          # versionName; the capitalized platformBuildVersion* fields do not.
          "${build_tools}apksigner" verify --print-certs "${apk}"
          badging="$("${build_tools}aapt2" dump badging "${apk}")"
          package_line="${badging%%$'\n'*}"
          version_code="$(grep -oE "versionCode='[0-9]+'" <<<"${package_line}" | cut -d"'" -f2)"
          version_name="$(grep -oE "versionName='[^']*'" <<<"${package_line}" | cut -d"'" -f2)"

          if [[ "${version_code}" != "${VERSION_CODE}" || "${version_name}" != "${VERSION_NAME}" ]]; then
            echo "::error::The APK carries versionCode='${version_code}' versionName='${version_name}', expected '${VERSION_CODE}' and '${VERSION_NAME}'"
            exit 1
          fi

          # The packaged assets are the static build: its entry point is inside
          # the APK, the Node server build's is not.
          listing="$(unzip -l "${apk}")"
          if ! grep -q 'assets/public/index.html' <<<"${listing}"; then
            echo '::error::The APK does not embed the static web build: assets/public/index.html is missing'
            exit 1
          fi
          if grep -q 'assets/public/index.js' <<<"${listing}"; then
            echo '::error::The APK embeds the Node server build, not the static web build'
            exit 1
          fi

          echo "Verified ${apk}: versionCode=${version_code}, versionName='${version_name}'"

      - name: Stage the APK for upload
        env:
          ASSET_NAME: ${{ steps.versioning.outputs.assetName }}
        run: |
          set -euo pipefail

          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/${ASSET_NAME}"

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versioning.outputs.assetName }}
          path: artifacts/${{ steps.versioning.outputs.assetName }}
          if-no-files-found: error
