name: Docker

on:
  push:
    branches: ['main']
    tags: ['*']
  pull_request:
    branches: ['main']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 'fankhauserli/voabkr-frontend/voabkr-frontend'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Code formatting check & lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Run unit tests
        run: bun run test:unit --project server --run

      - name: Determine and bump version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          package="${GITHUB_REPOSITORY##*/}"
          versions=$(
            {
              git ls-remote --tags --refs origin \
                | awk -F/ '{print $3}'
              gh api --paginate "/user/packages/container/${package}/versions" 2>/dev/null \
                | jq -r '.[].metadata.container.tags[]?' 2>/dev/null || true
            } \
              | sed -E 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$' \
              | sort -V -u || true
          )

          latest=$(printf '%s\n' "${versions}" | tail -n 1)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            next="${GITHUB_REF_NAME#v}"
            next="${next%%-pre.*}"
          elif [[ -z "${latest}" ]]; then
            next="0.1.0-pre.1"
          elif [[ "${latest}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-pre\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-pre.$((BASH_REMATCH[4] + 1))"
          else
            next="${latest}-pre.1"
          fi

          echo "tag=${next}" >> "${GITHUB_OUTPUT}"
          echo "Using version ${next}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versioning.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
