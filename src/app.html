<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="#F8F6F0" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
		<meta name="application-name" content="voabkr" />
		<meta name="apple-mobile-web-app-title" content="voabkr" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
		/>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="antialiased selection:bg-primary/20 selection:text-ink-primary"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
