<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <rect width="128" height="128" rx="28" fill="#F8F6F0"/>
  <rect x="8" y="8" width="112" height="112" rx="20" fill="none" stroke="#E3DEC3" stroke-width="2"/>
  <!-- Seal container in Terracotta -->
  <rect x="18" y="18" width="92" height="92" rx="16" fill="#C2593F"/>
  <rect x="22" y="22" width="84" height="84" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- Korean Hangul '보' seal lettering -->
  <text x="64" y="80" 
        font-family="'Pretendard', 'Noto Sans KR', -apple-system, sans-serif" 
        font-size="56" 
        font-weight="800" 
        fill="#F8F6F0" 
        text-anchor="middle"
        dominant-baseline="central"
        letter-spacing="-2">보</text>
</svg>
